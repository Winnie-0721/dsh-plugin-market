name: OIDC Probe Caller (temporary)

# 调用方：用 workflow_call 调 oidc-probe-callee.yml，看被调用文件里的 OIDC 声明
# 指向「调用方文件」还是「被调用文件」。这决定了修复方案。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/oidc-probe-callee.yml
