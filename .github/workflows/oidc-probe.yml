name: OIDC Probe (temporary)

# 临时探针：只为回答一个事实问题——
#   **当一个 workflow 通过 workflow_call 调用另一个 workflow 时，
#     OIDC 令牌里的 job_workflow_ref 指向「调用方文件」还是「被调用（可复用）文件」？**
#
# 为什么必须问：npm 的 Trusted Publisher 把信任绑定到**具体 workflow 文件名**，
# 而我们已验证 publish-npm.yml 能成功、pack-release.yml 里自建的发布 job 报 ENEEDAUTH。
# 若 job_workflow_ref 指向被调用文件，则「pack-release 通过 workflow_call 复用
# publish-npm.yml」就是正解；否则必须换架构。
#
# 这是纯读取，不做任何发布，不消耗版本号。学完即删。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: 请求 OIDC 令牌并打印 npm 会校验的那几个声明
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request

          base = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          url = base + "&audience=npm:registry.npmjs.org"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + token})
          jwt = json.load(urllib.request.urlopen(req))["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("=== PROBE-CLAIMS-BEGIN ===")
          for k in ("job_workflow_ref", "workflow_ref", "ref", "sha",
                    "event_name", "repository", "repository_owner", "sub", "aud"):
              print(f"{k} = {claims.get(k)}")
          print("=== PROBE-CLAIMS-END ===")
          PY
