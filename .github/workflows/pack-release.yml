name: Pack and Release

# 打包与发布都在 CI 做——本地从此不产生任何打包产物，也不消耗 gh / npm token：
#   标签推送 → 门禁（release.ps1 内跑全部 verify/*.test.mjs）→ pnpm pack
#   → 创建 GitHub Release 并传 tarball + version.json → 发布 npm。
#
# 本地只剩轻量五步：门禁 → 递增 → 提交 → 打标签 → 推送（scripts/release.ps1 -Bump patch）。
# 回退 / 旧版安装一律从 GitHub Release 附件下载（releases/ 目录已从仓库移除）。
#
# workflow_dispatch 用于补跑 / 回填：按 package.json 的版本找到对应标签重新打包；
# Release 已存在则幂等补传附件（--clobber），npm 已有该版本则跳过。
# （release 事件不会因 GITHUB_TOKEN 创建的 Release 而触发其它 workflow，所以 npm
#   发布放在本文件的 publish-npm job 里；publish-npm.yml 保留作手动补发通道。）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    # release.ps1 带 Windows 路径拼接，门禁与打包都在 Windows runner 上跑。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 门禁的可重入检查与 build 后缀（提交数.短哈希）都要全历史 + 标签。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: 安装 pnpm（CI 上没有 DSH 运行时，release.ps1 会用 PATH 上的 pnpm）
        run: npm install -g pnpm@latest

      - name: 门禁 → 打包 → 创建 Release
        run: pwsh -NoProfile -File scripts/release.ps1 -CiPack
        env:
          GH_TOKEN: ${{ github.token }}

  publish-npm:
    needs: pack
    runs-on: ubuntu-latest
    # 与 publish-npm.yml 同一套凭据策略：npm Trusted Publishing（OIDC），不存 token。
    # 在 npmjs.com 给本包添加 Trusted publisher（repository=本仓库、workflow=本文件名）；
    # 若要改回 token：删掉 id-token，给发布步骤加回 NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}。
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          # 故意不写 registry-url：npmjs 就是默认 registry，而 registry-url 会让
          # setup-node 注入 NODE_AUTH_TOKEN=github.token（对 npm 无效），可能盖过 OIDC。
          # OIDC 只依赖上面的 id-token: write + npm ≥ 11.5.1。

      - name: 读出要发布的包与版本
        id: spec
        run: |
          SPEC=$(node -p "const p=require('./plugin-market/package.json'); p.name + '@' + p.version")
          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"
          echo "目标：$SPEC"

      - name: 该版本已在 npm 则跳过（补跑幂等）
        id: guard
        run: |
          if npm view "${{ steps.spec.outputs.spec }}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.spec.outputs.spec }} 已在 npm，跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.guard.outputs.skip == 'false'
        working-directory: plugin-market
        run: |
          # **用 `npm stage publish`，不是 `npm publish`。**
          # 本包在 npmjs.com 上的 Trusted Publisher 只授予了 `npm stage publish` 与
          # `npm dist-tag` 两项权限（包设置页 Trusted Publisher 卡片上写着的），
          # 没有 `npm publish` → 直接 `npm publish` 会被拒：
          #   403 Forbidden - PUT https://registry.npmjs.org/... - OIDC permission denied for this action
          # （v1.1.6 实测就到这一步；这是 npm 允许的「暂存发布」，把 2FA 人工确认推迟到最后一步，
          #  安全性更高——所以按它来，而不是去放松 npm 那边的权限。）
          #
          # 两个坑都记在这里，别再踩：
          #  1) **不能写 `npm@latest`**：npm 12 起要求 node ^22.22.2 || ^24.15.0 || >=26，
          #     而本 workflow 钉的是 node 22.14.0 → `npm install -g npm@latest` 会 EBADENGINE
          #     失败，publish 根本没跑到（v1.1.6 第一次失败就是这个）。
          #  2) `npm stage` 子命令要较新的 11.x（11.8.0 还没有）。`^11.5.1` 会解析到最新的
          #     11.x（≥11.21），既有 stage、又与 node 22.14.0 相容。
          npm install -g "npm@^11.5.1"
          npm stage publish --access public

      - name: 提示下一步（暂存发布需人工批准）
        if: steps.guard.outputs.skip == 'false'
        run: |
          echo "::notice title=npm 暂存发布已提交::这个包用的是 staged publishing，还需人工批准才会公开。"
          echo "本地批准：npm stage list → npm stage approve <stage-id>（需要 2FA 一次性验证码）"
          echo "或去 npmjs.com 该包页面点 Approve。"
