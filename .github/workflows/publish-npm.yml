name: Publish to npm

# 本文件是**唯一**的 npm 发布实现，也是 npm Trusted Publisher 上登记的那个文件名。
#
# ⚠️ 为什么本文件必须**自己**被标签触发，而不能由 pack-release.yml 用 workflow_call 调
#    （v1.3.0 查清的真因；v1.1.6 / v1.2.0 / v1.3.0 三次 ENEEDAUTH 的同一个根）：
#
#    npm 官方文档《Trusted publishing》明确写着这条限制：
#      "Some GitHub Actions workflows use workflow_call to invoke other workflows that
#       run npm publish ... When this happens, validation checks **the calling
#       workflow's name** instead of the workflow that actually contains the publish
#       command, which can cause configuration mismatches."
#      https://docs.npmjs.com/trusted-publishers/
#
#    也就是说：**OIDC 令牌**里的 `job_workflow_ref` 确实指向被调用的本文件（这点曾经
#    实测过、也没错），但 **npm 服务端校验的是调用方**。两者不一致时，令牌看着完全正常、
#    本文件里那段身份自检也一路绿灯，可一到 `npm stage publish` 就只回一句：
#      npm error code ENEEDAUTH
#      npm error need auth This command requires you to be logged in to https://registry.npmjs.org/
#    v1.3.0 就是这样：自检打印 job_workflow_ref = publish-npm.yml@refs/tags/v1.3.0、
#    判定「身份正确」，紧接着发布仍然 ENEEDAUTH。
#
#    历史对照（很能说明问题）：
#      · v1.2.0 成功：是**手动 workflow_dispatch 直接跑本文件**（ref=refs/heads/main）
#        → 调用方就是本文件 → 校验通过 → npm 上留下 trustedPublisher 与 provenance 记录。
#      · v1.3.0 失败：标签触发 pack-release.yml → workflow_call 本文件
#        → npm 看到的是 pack-release.yml → 与登记的 publish-npm.yml 不符 → ENEEDAUTH。
#
#    结论：**取消 workflow_call 这条复用路径**。本文件自己监听 `push: tags: ['v*']`，
#    与 pack-release.yml **并列**触发（一个发 GitHub Release，一个发 npm），互不调用。
#    这样 npm 看到的调用方永远是本文件，与登记一致。
#
#    代价与取舍：发布逻辑仍然只有一份（就在本文件），只是从「被复用」改成「并列触发」。
#    pack-release.yml 里那个 publish-npm job 已删除——它不可能通过校验。
#
# 版本号由 release.ps1 独家管理，这里绝不 bump：
# npm version patch 会破坏 versionCode 归零纪律，且同版本重发会被 npm 拒。
on:
  # **主路径**：标签推送即发布（与 pack-release.yml 并列，两者互不调用）。
  push:
    tags: ['v*']
  # 人工建 Release 时触发（注意：GITHUB_TOKEN 创建的 Release 不会触发 workflow）。
  release:
    types: [published]
  # 手动触发：补发 / 重试都走这里（v1.2.0 就是靠它发成功的）。
  workflow_dispatch:

# id-token: write = npm Trusted Publishing（OIDC）：在 npmjs.com 给本包添加
# Trusted publisher（repository=本仓库、workflow=本文件名）后，publish 不再需要 NPM_TOKEN。
# 若改回 token 发布：给 publish 步骤加回 env: NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}。
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        # package.json 在 plugin-market/ 子目录（在根目录跑会 ENOENT）。
        working-directory: plugin-market
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          # 故意不写 registry-url：npmjs 是默认 registry；写它反而会让 setup-node
          # 注入 NODE_AUTH_TOKEN=github.token（对 npm 无效），可能盖过 OIDC。

      # OIDC 要求 npm ≥ 11.5.1（Node 自带的 10.x 不够新）。
      # **两个坑**：
      #  1) 不要写 `npm@latest`：npm 12 起要求 node ^22.22.2 || ^24.15.0 || >=26，
      #     而这里钉的是 node 22.14.0 → `npm install -g npm@latest` 会 EBADENGINE 失败，
      #     publish 根本没跑到（v1.1.6 第一次失败就是这个）。
      #  2) `npm stage` 子命令要较新的 11.x（11.8.0 还没有）。`^11.5.1` 解析到最新 11.x，两全。
      # 本包无依赖、无构建：不跑 npm ci（没有 package-lock.json 会直接失败），
      # checkout 下来就是发布内容。
      - run: npm install -g "npm@^11.5.1"

      # **身份自检：把「文件名不对」从一句神秘的 ENEEDAUTH 变成一句看得懂的错。**
      #
      # npm 的 Trusted Publisher 按 `job_workflow_ref` 里的**文件名**匹配，而这个字段
      # 只指向「实际执行本 job 的那个 workflow 文件」。如果哪天有人把发布步骤从
      # pack-release.yml 里自己跑一遍（或忘了用 workflow_call 复用），这里就会立刻
      # 红在**发布之前**，并且直接告诉你登记的是哪个文件、实际是哪个文件——
      # 而不是等到 `npm stage publish` 才甩一句 need auth（v1.1.6/v1.2.0 各踩一次，
      # 每次都要去翻日志才看得懂）。
      #
      # 注意：**不设 audience 之外的假设**——只请求令牌、解出声明、比对文件名。
      # 这一步不发布任何东西，纯读。
      - name: 自检 OIDC 身份（文件必须是 publish-npm.yml）
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, urllib.request

          # 本 job 必须拿到 id-token: write（调用方与被调用方都要声明，缺一个就没有这个变量）。
          base = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
          token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          if not base or not token:
              sys.exit("拿不到 OIDC 请求地址/令牌：确认调用方与被调用方都声明了 `id-token: write`。")

          # 用 npm 的 audience 请求，确保拿到的就是 npm 会校验的那张令牌。
          req = urllib.request.Request(
              base + "&audience=npm:registry.npmjs.org",
              headers={"Authorization": "bearer " + token},
          )
          jwt = json.load(urllib.request.urlopen(req))["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          job_ref = claims.get("job_workflow_ref", "")
          wf_ref = claims.get("workflow_ref", "")
          print(f"job_workflow_ref = {job_ref}")
          print(f"workflow_ref     = {wf_ref}")

          # **两个字段都要是 publish-npm.yml**，缺一不可。
          #
          # 为什么：npm 官方文档写明，workflow_call 场景下它校验的是**调用方**
          # （"validation checks the calling workflow's name instead of the workflow that
          #  actually contains the publish command"）。
          #   · job_workflow_ref = 实际执行发布命令的文件（workflow_call 时是被调用方）
          #   · workflow_ref     = 触发整条链的入口文件（workflow_call 时是调用方）
          # 只查前者会给出**假绿灯**：v1.3.0 就是这样——job_workflow_ref 是
          # publish-npm.yml、自检打印「身份正确」，然后 npm 仍然 ENEEDAUTH，
          # 因为 npm 看的是 workflow_ref（pack-release.yml）。
          #
          # 现在本文件自己被 `push: tags` 触发，两个字段都应该是本文件；任何一个是别的
          # 文件，就说明有人又把它挂到了别的 workflow 下面，立刻在这里失败。
          expected = ".github/workflows/publish-npm.yml@"
          for label, value in (("job_workflow_ref", job_ref), ("workflow_ref", wf_ref)):
              if expected not in value:
                  sys.exit(
                      f"OIDC 身份不对：{label} = {value or '(空)'}，不是 publish-npm.yml。"
                      "npm 的 Trusted Publisher 登记的是 publish-npm.yml，且它在 workflow_call "
                      "场景下校验的是**调用方**文件名——所以本文件必须自己监听 push: tags，"
                      "不能被别的 workflow 用 `uses:` 调用。"
                  )
          print("OIDC 身份正确：job_workflow_ref 与 workflow_ref 都是 publish-npm.yml，npm 会认。")
          PY

      # 幂等闸门（从原来 pack-release.yml 里那个重复 job 搬过来的，别丢）：
      # 版本已在 npm 上就跳过——否则 pack-release 补跑 / workflow_dispatch 重跑时
      # `npm stage publish` 会因版本已存在而失败，把整个 Pack and Release 弄红。
      # 查的是 registry 上是否已有该版本（不是 dist-tags.latest，因为暂存发布在批准前
      # 不会更新 latest，用 latest 判断会误判成「没发过」）。
      - name: 该版本已在 npm 则跳过（补跑幂等）
        id: guard
        run: |
          SPEC=$(node -p "const p=require('./package.json'); p.name + '@' + p.version")
          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"
          echo "目标：$SPEC"
          if npm view "$SPEC" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$SPEC 已在 npm（公开或已批准），跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$SPEC 尚未公开——将提交暂存发布（暂存后仍需人工 2FA 批准才公开）"
          fi

      # 本包在 npmjs.com 的 Trusted Publisher 只授予 `npm stage publish` 与 `npm dist-tag`，
      # 没有 `npm publish` → 用普通 `npm publish` 会被拒：
      #   403 OIDC permission denied for this action
      # 所以走暂存发布；之后需人工批准（`npm stage approve <id>`，要 2FA）才公开。
      - name: Stage publish to npm
        if: steps.guard.outputs.skip == 'false'
        run: npm stage publish --access public

      - name: 提示下一步（暂存发布需人工批准）
        if: steps.guard.outputs.skip == 'false'
        run: |
          echo "::notice title=npm 暂存发布已提交::这个包用的是 staged publishing，还需人工批准才会公开。"
          echo "本地批准：npm stage list → npm stage approve <stage-id>（需要 2FA 一次性验证码）"
          echo "或去 npmjs.com 该包页面点 Approve。"
